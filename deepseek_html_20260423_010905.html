<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>教师专用智能课堂助手 | 课堂管理神器</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #f0f7ff;
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            padding: 20px;
            color: #1e2a3e;
        }

        /* 主容器 */
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* 头部区域 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            background: white;
            padding: 16px 24px;
            border-radius: 40px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            margin-bottom: 24px;
        }
        .title h1 {
            font-size: 1.6rem;
            background: linear-gradient(135deg, #2b5e3b, #1e3a8a);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .title p {
            font-size: 0.8rem;
            color: #4b5563;
        }
        .date-badge {
            background: #eef2ff;
            padding: 8px 16px;
            border-radius: 40px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .horn-btn {
            background: #dc2626;
            border: none;
            color: white;
            font-size: 1.8rem;
            padding: 10px 20px;
            border-radius: 60px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 0 #991b1b;
            transition: 0.07s linear;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .horn-btn:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #991b1b;
        }

        /* 网格布局 */
        .grid-2col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 24px;
        }

        /* 通用卡片 */
        .card {
            background: white;
            border-radius: 32px;
            padding: 20px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05);
            transition: all 0.2s;
            border: 1px solid rgba(0,0,0,0.05);
        }
        .card h2 {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.5rem;
            margin-bottom: 18px;
            border-left: 5px solid #3b82f6;
            padding-left: 14px;
        }

        /* 小组积分榜 */
        .groups-container {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            justify-content: space-around;
        }
        .group-card {
            background: #f8fafc;
            border-radius: 28px;
            padding: 16px;
            text-align: center;
            flex: 1;
            min-width: 100px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }
        .group-name {
            font-size: 1.4rem;
            font-weight: bold;
            background: #e2e8f0;
            display: inline-block;
            padding: 4px 16px;
            border-radius: 40px;
            margin-bottom: 12px;
        }
        .group-score {
            font-size: 2.5rem;
            font-weight: 800;
            margin: 8px 0;
            color: #0f3b2c;
        }
        .group-buttons button {
            font-size: 1.5rem;
            width: 48px;
            height: 48px;
            margin: 0 5px;
            border: none;
            border-radius: 30px;
            background: #eef2ff;
            cursor: pointer;
            font-weight: bold;
            transition: 0.1s;
        }
        .group-buttons button:active {
            transform: scale(0.94);
        }
        .btn-add { background: #22c55e; color: white; }
        .btn-sub { background: #ef4444; color: white; }

        /* 学生名单 & 点名器 */
        .student-list {
            max-height: 200px;
            overflow-y: auto;
            background: #f1f5f9;
            border-radius: 24px;
            padding: 8px;
            margin-bottom: 16px;
        }
        .student-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            margin: 6px 0;
            padding: 8px 12px;
            border-radius: 40px;
        }
        .call-count {
            background: #fbbf24;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .random-result {
            background: #d9f99d;
            padding: 12px;
            border-radius: 40px;
            text-align: center;
            font-weight: bold;
            margin: 12px 0;
            font-size: 1.2rem;
        }
        .flex-buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 12px;
        }
        .btn-primary {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            flex: 1;
        }
        .btn-secondary {
            background: #64748b;
            color: white;
        }

        /* 行为记录 + 快速填充 */
        .quick-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            background: #f1f5f9;
            padding: 12px;
            border-radius: 28px;
        }
        .quick-btn {
            background: white;
            border: 1px solid #cbd5e1;
            padding: 8px 16px;
            border-radius: 60px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.05s linear;
            font-size: 0.9rem;
        }
        .quick-btn.positive { border-left: 4px solid #16a34a; }
        .quick-btn.warning { border-left: 4px solid #f97316; }
        .quick-btn.negative { border-left: 4px solid #dc2626; }
        .custom-record {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            align-items: center;
        }
        .custom-record select, .custom-record input {
            flex: 1;
            padding: 12px;
            border-radius: 60px;
            border: 1px solid #cbd5e1;
            font-size: 0.9rem;
        }
        .records-list {
            background: #fefce8;
            border-radius: 24px;
            padding: 12px;
            max-height: 220px;
            overflow-y: auto;
            font-size: 0.85rem;
        }
        .record-item {
            border-bottom: 1px solid #e2e8f0;
            padding: 8px 4px;
            font-family: monospace;
        }

        /* 日历历史模块 */
        .calendar-section {
            margin-top: 20px;
            background: white;
            border-radius: 32px;
            padding: 20px;
        }
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            text-align: center;
            margin-bottom: 20px;
        }
        .cal-day {
            background: #f1f5f9;
            padding: 10px 4px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: 500;
        }
        .cal-day.today {
            background: #3b82f6;
            color: white;
        }
        .cal-day.has-data {
            background: #facc15;
            color: #1e293b;
            font-weight: bold;
        }
        .history-preview {
            background: #eef2ff;
            border-radius: 24px;
            padding: 16px;
            margin-top: 12px;
        }
        button.small {
            background: #334155;
            padding: 6px 12px;
            font-size: 0.8rem;
        }

        @media (max-width: 800px) {
            .grid-2col {
                grid-template-columns: 1fr;
            }
            .header {
                flex-direction: column;
                gap: 12px;
                align-items: stretch;
            }
        }
        footer {
            text-align: center;
            margin-top: 30px;
            font-size: 0.7rem;
            color: #5b6e8c;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="title">
            <h1>🍎 教师智能课堂助手</h1>
            <p>小组积分 · 随机点名 · 行为记录 · 历史日历</p>
        </div>
        <div class="date-badge">
            <span>📅 当前日期：</span>
            <strong id="currentDateLabel"></strong>
        </div>
        <button class="horn-btn" id="hornBtn">🔊 纪律小喇叭</button>
    </div>

    <div class="grid-2col">
        <!-- 左侧：小组积分榜 -->
        <div class="card">
            <h2>🏆 小组积分榜</h2>
            <div id="groupsArea" class="groups-container"></div>
            <p style="margin-top:12px; font-size:12px; color:gray;">✨ 点击 +/- 即时保存，历史数据可追溯</p>
        </div>

        <!-- 右侧：随机点名器 -->
        <div class="card">
            <h2>🎲 随机点名器</h2>
            <div id="studentListArea" class="student-list"></div>
            <div class="flex-buttons">
                <button id="randomPickBtn" class="btn-primary">🎲 随机点名</button>
                <button id="addStudentBtn" class="btn-primary btn-secondary">➕ 添加学生</button>
            </div>
            <div id="randomResult" class="random-result">✨ 点击点名 ✨</div>
            <p style="font-size:12px">📊 点名次数会累计，按日期独立保存</p>
        </div>
    </div>

    <!-- 课堂行为记录 + 快速填充 -->
    <div class="card" style="margin-bottom: 24px;">
        <h2>📝 课堂行为记录</h2>
        <div class="quick-actions" id="quickActionsArea"></div>
        <div class="custom-record">
            <select id="recordStudentSelect"></select>
            <input type="text" id="recordCustomText" placeholder="输入自定义行为，如：积极发言..." />
            <button id="addCustomRecordBtn" class="btn-primary" style="flex:0 0 auto;">➕ 添加记录</button>
        </div>
        <div id="recordsListArea" class="records-list"></div>
    </div>

    <!-- 日历历史模块 -->
    <div class="calendar-section">
        <div class="calendar-header">
            <h3>📅 历史记录日历</h3>
            <div>
                <button id="prevMonthBtn" class="small">◀ 上月</button>
                <button id="gotoTodayBtn" class="small" style="margin:0 8px;">今天</button>
                <button id="nextMonthBtn" class="small">下月 ▶</button>
            </div>
        </div>
        <div id="calendarGrid" class="calendar-grid"></div>
        <div id="historyDetail" class="history-preview">
            💡 点击任意日期可查看当天数据（小组积分、点名记录等）
        </div>
    </div>
    <footer>⚡ 所有数据自动保存至浏览器 | 刷新页面不丢失 | 小喇叭需先点击页面任意处启用音频</footer>
</div>

<script>
    // ---------- 数据结构定义 ----------
    // 默认小组名称
    const GROUP_NAMES = ["第1组", "第2组", "第3组"];
    // 默认学生
    const DEFAULT_STUDENTS = ["张三", "李四", "王五"];
    
    // 全局存储: 所有日期的数据 { "2025-01-15": { groupScores, students, behaviorRecords } }
    let allClassData = {};
    let currentDisplayDate = new Date();   // 当前选中的日期(用于日历预览)
    let currentEditDate = null;            // 实际编辑的日期（今日或从日历选的日期）
    
    // 获取今日 YYYY-MM-DD
    function getTodayStr() {
        const d = new Date();
        return d.toISOString().split('T')[0];
    }
    
    // 日期对象转字符串
    function dateToStr(date) {
        let y = date.getFullYear();
        let m = String(date.getMonth() + 1).padStart(2, '0');
        let d = String(date.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
    }
    
    // 获取默认数据结构 (小组积分全0，学生对象含点名次数)
    function getDefaultDataStruct() {
        return {
            groupScores: [0, 0, 0],
            students: DEFAULT_STUDENTS.map(name => ({ name: name, callCount: 0 })),
            behaviorRecords: []   // 元素: { time: "HH:MM", student: "张三", action: "举手发言" }
        };
    }
    
    // 加载所有数据从localStorage
    function loadAllData() {
        const stored = localStorage.getItem("TeacherClassroom_AllData_V2");
        if (stored) {
            allClassData = JSON.parse(stored);
        } else {
            allClassData = {};
        }
        // 确保今日数据存在
        const today = getTodayStr();
        if (!allClassData[today]) {
            allClassData[today] = getDefaultDataStruct();
            saveAllData();
        }
        // 确保每个已有数据的学生格式正确(兼容旧)
        for (let dateKey in allClassData) {
            const dayData = allClassData[dateKey];
            if (!dayData.students || dayData.students.length === 0) {
                dayData.students = DEFAULT_STUDENTS.map(name => ({ name, callCount: 0 }));
            } else {
                // 保证每个学生有callCount字段
                dayData.students = dayData.students.map(s => {
                    if (typeof s === 'string') return { name: s, callCount: 0 };
                    if (s.callCount === undefined) s.callCount = 0;
                    return s;
                });
            }
            if (!dayData.behaviorRecords) dayData.behaviorRecords = [];
            if (!dayData.groupScores) dayData.groupScores = [0,0,0];
            // 确保小组分数长度正确
            while(dayData.groupScores.length < 3) dayData.groupScores.push(0);
        }
        saveAllData();
    }
    
    function saveAllData() {
        localStorage.setItem("TeacherClassroom_AllData_V2", JSON.stringify(allClassData));
    }
    
    // 获取当前编辑日期的数据 (currentEditDate 字符串)
    function getCurrentData() {
        if (!currentEditDate) currentEditDate = getTodayStr();
        if (!allClassData[currentEditDate]) {
            allClassData[currentEditDate] = getDefaultDataStruct();
            saveAllData();
        }
        return allClassData[currentEditDate];
    }
    
    // 更新当前日期数据并保存
    function updateCurrentData(newData) {
        if (!currentEditDate) currentEditDate = getTodayStr();
        allClassData[currentEditDate] = newData;
        saveAllData();
        // 刷新整个界面
        renderAllByCurrentDate();
    }
    
    // 渲染所有组件 (基于 currentEditDate)
    function renderAllByCurrentDate() {
        const data = getCurrentData();
        // 渲染小组积分
        renderGroups(data.groupScores);
        // 渲染学生点名列表
        renderStudentList(data.students);
        // 渲染行为记录列表
        renderBehaviorRecords(data.behaviorRecords);
        // 渲染下拉选择学生
        renderStudentSelect(data.students);
        // 更新顶部日期显示
        document.getElementById("currentDateLabel").innerText = currentEditDate;
        // 随机点名结果区域可保留，不清空但可以用占位
        if (!document.getElementById("randomResult").innerText.includes("点名")) {
            // 保留原样 不改动
        }
    }
    
    // 小组积分渲染
    function renderGroups(scores) {
        const container = document.getElementById("groupsArea");
        container.innerHTML = "";
        GROUP_NAMES.forEach((name, idx) => {
            const scoreVal = scores[idx] || 0;
            const groupDiv = document.createElement("div");
            groupDiv.className = "group-card";
            groupDiv.innerHTML = `
                <div class="group-name">${name}</div>
                <div class="group-score">${scoreVal}</div>
                <div class="group-buttons">
                    <button class="btn-add" data-group="${idx}" data-delta="1">+1</button>
                    <button class="btn-sub" data-group="${idx}" data-delta="-1">-1</button>
                </div>
            `;
            container.appendChild(groupDiv);
        });
        // 绑定事件
        document.querySelectorAll("[data-group]").forEach(btn => {
            btn.addEventListener("click", (e) => {
                e.stopPropagation();
                const groupIdx = parseInt(btn.dataset.group);
                const delta = parseInt(btn.dataset.delta);
                const data = getCurrentData();
                let newScore = (data.groupScores[groupIdx] || 0) + delta;
                if (newScore < 0) newScore = 0;
                data.groupScores[groupIdx] = newScore;
                updateCurrentData(data);
            });
        });
    }
    
    // 学生点名列表渲染
    function renderStudentList(students) {
        const container = document.getElementById("studentListArea");
        if (!students.length) {
            container.innerHTML = "<div style='padding:12px;text-align:center'>暂无学生，请添加</div>";
            return;
        }
        container.innerHTML = "";
        students.forEach((stu, idx) => {
            const div = document.createElement("div");
            div.className = "student-item";
            div.innerHTML = `
                <span>📖 ${stu.name}</span>
                <span class="call-count">点名 ${stu.callCount || 0} 次</span>
                <button class="small" style="background:#cbd5e1;border:none;border-radius:30px;padding:2px 12px;" data-delname="${stu.name}">🗑️</button>
            `;
            container.appendChild(div);
        });
        // 删除学生事件
        document.querySelectorAll("[data-delname]").forEach(btn => {
            btn.addEventListener("click", (e) => {
                const name = btn.dataset.delname;
                let data = getCurrentData();
                data.students = data.students.filter(s => s.name !== name);
                updateCurrentData(data);
            });
        });
    }
    
    function renderStudentSelect(students) {
        const select = document.getElementById("recordStudentSelect");
        select.innerHTML = "";
        students.forEach(s => {
            const opt = document.createElement("option");
            opt.value = s.name;
            opt.innerText = s.name;
            select.appendChild(opt);
        });
        if (students.length === 0) {
            select.innerHTML = "<option>请先添加学生</option>";
        }
    }
    
    function renderBehaviorRecords(records) {
        const container = document.getElementById("recordsListArea");
        if (!records.length) {
            container.innerHTML = "<div style='text-align:center;color:gray'>✨ 暂无记录，使用快速填充或自定义添加</div>";
            return;
        }
        container.innerHTML = records.slice().reverse().map(rec => {
            return `<div class="record-item">🕒 ${rec.time} &nbsp; 👤 ${rec.student} &nbsp; 📌 ${rec.action}</div>`;
        }).join("");
    }
    
    // 添加行为记录
    function addBehavior(student, actionText) {
        if (!student || !actionText) return;
        const data = getCurrentData();
        const now = new Date();
        const timeStr = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
        data.behaviorRecords.push({
            time: timeStr,
            student: student,
            action: actionText
        });
        updateCurrentData(data);
    }
    
    // 随机点名
    function randomCall() {
        const data = getCurrentData();
        const students = data.students;
        if (students.length === 0) {
            document.getElementById("randomResult").innerHTML = "⚠️ 暂无学生，请先添加学生";
            return;
        }
        const randomIndex = Math.floor(Math.random() * students.length);
        const picked = students[randomIndex];
        picked.callCount = (picked.callCount || 0) + 1;
        updateCurrentData(data);
        document.getElementById("randomResult").innerHTML = `🎉 点到：${picked.name}  🎉 <span style="font-size:0.8rem;">(累计点名${picked.callCount}次)</span>`;
        // 震动效果可选（如果支持）
        if (navigator.vibrate) navigator.vibrate(100);
    }
    
    // 添加学生
    function addNewStudent() {
        let newName = prompt("请输入学生姓名:");
        if (newName && newName.trim()) {
            newName = newName.trim();
            const data = getCurrentData();
            if (data.students.find(s => s.name === newName)) {
                alert("学生已存在！");
                return;
            }
            data.students.push({ name: newName, callCount: 0 });
            updateCurrentData(data);
        }
    }
    
    // ---------- 小喇叭 (刺耳高频声) ----------
    let audioAllowed = false;
    function playLoudHorn() {
        if (!audioAllowed) {
            alert("🔊 首次使用需要点击页面任意位置启用声音，之后小喇叭即可生效。");
            return;
        }
        try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            const ctx = new AudioContext();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.frequency.value = 1200;   // 刺耳高频
            gain.gain.value = 0.4;
            osc.start();
            gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 1.2);
            osc.stop(ctx.currentTime + 1.2);
            // 二次谐波增加刺耳感
            const osc2 = ctx.createOscillator();
            const gain2 = ctx.createGain();
            osc2.connect(gain2);
            gain2.connect(ctx.destination);
            osc2.frequency.value = 2400;
            gain2.gain.value = 0.25;
            osc2.start();
            gain2.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 1);
            osc2.stop(ctx.currentTime + 1);
        } catch(e) { console.warn(e); alert("音频初始化失败，但功能可用"); }
        if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
    }
    
    // 启用音频 (用户首次点击)
    function enableAudioOnFirstClick() {
        if (!audioAllowed) {
            audioAllowed = true;
            // 静音初始化一个空context
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            ctx.resume().then(() => { console.log("音频已启用"); });
        }
    }
    
    // ---------- 日历 & 历史数据查看 ----------
    let currentCalendarYear = new Date().getFullYear();
    let currentCalendarMonth = new Date().getMonth(); // 0-11
    
    function renderCalendar() {
        const firstDayOfMonth = new Date(currentCalendarYear, currentCalendarMonth, 1);
        const startWeekday = firstDayOfMonth.getDay(); // 0周日
        const daysInMonth = new Date(currentCalendarYear, currentCalendarMonth + 1, 0).getDate();
        const gridContainer = document.getElementById("calendarGrid");
        gridContainer.innerHTML = "";
        const weekdays = ["日","一","二","三","四","五","六"];
        weekdays.forEach(day => {
            const cell = document.createElement("div");
            cell.style.fontWeight = "bold"; cell.style.color="#4b5563";
            cell.innerText = day;
            gridContainer.appendChild(cell);
        });
        let emptyCells = startWeekday;
        for (let i = 0; i < emptyCells; i++) {
            const emptyDiv = document.createElement("div");
            emptyDiv.innerHTML = "";
            gridContainer.appendChild(emptyDiv);
        }
        const todayStr = getTodayStr();
        for (let d = 1; d <= daysInMonth; d++) {
            const dateObj = new Date(currentCalendarYear, currentCalendarMonth, d);
            const dateKey = dateToStr(dateObj);
            const hasData = allClassData[dateKey] !== undefined;
            const isToday = (dateKey === todayStr);
            const dayDiv = document.createElement("div");
            dayDiv.className = "cal-day";
            if (isToday) dayDiv.classList.add("today");
            if (hasData) dayDiv.classList.add("has-data");
            dayDiv.innerText = d;
            dayDiv.addEventListener("click", (function(key) {
                return function() { loadHistoryByDate(key); };
            })(dateKey));
            gridContainer.appendChild(dayDiv);
        }
    }
    
    function loadHistoryByDate(dateKey) {
        currentEditDate = dateKey;
        if (!allClassData[dateKey]) {
            allClassData[dateKey] = getDefaultDataStruct();
            saveAllData();
        }
        renderAllByCurrentDate();
        // 额外在历史面板展示摘要
        const data = allClassData[dateKey];
        const totalRecords = data.behaviorRecords.length;
        const totalCalls = data.students.reduce((sum, s) => sum + (s.callCount||0), 0);
        const groupScoresStr = data.groupScores.map((s,i)=>`${GROUP_NAMES[i]}${s}`).join(" · ");
        const detailDiv = document.getElementById("historyDetail");
        detailDiv.innerHTML = `<strong>📆 ${dateKey} 课堂摘要</strong><br>🏅 小组积分：${groupScoresStr}<br>📋 行为记录：${totalRecords}条 &nbsp; 🎲 点名总次数：${totalCalls}<br>
        <button id="viewFullBtn" style="margin-top:8px; background:#3b82f6; border:none; padding:6px 12px; border-radius:60px; color:white;">🔍 当前界面已切换至此日期</button>`;
        const btn = document.getElementById("viewFullBtn");
        if(btn) btn.onclick = () => { renderAllByCurrentDate(); };
    }
    
    function gotoToday() {
        const today = getTodayStr();
        currentEditDate = today;
        if (!allClassData[today]) {
            allClassData[today] = getDefaultDataStruct();
            saveAllData();
        }
        renderAllByCurrentDate();
        // 同时移动日历到当月
        const now = new Date();
        currentCalendarYear = now.getFullYear();
        currentCalendarMonth = now.getMonth();
        renderCalendar();
        loadHistoryByDate(today);
    }
    
    function prevMonth() {
        let newDate = new Date(currentCalendarYear, currentCalendarMonth, 1);
        newDate.setMonth(newDate.getMonth() - 1);
        currentCalendarYear = newDate.getFullYear();
        currentCalendarMonth = newDate.getMonth();
        renderCalendar();
    }
    function nextMonth() {
        let newDate = new Date(currentCalendarYear, currentCalendarMonth, 1);
        newDate.setMonth(newDate.getMonth() + 1);
        currentCalendarYear = newDate.getFullYear();
        currentCalendarMonth = newDate.getMonth();
        renderCalendar();
    }
    
    // 初始化快速填充按钮 (将“玩手机”改为“上课摸鱼”)
    const QUICK_ACTIONS = [
        { emoji:"📖", label:"举手发言", type:"positive" },
        { emoji:"🤝", label:"合作积极", type:"positive" },
        { emoji:"⚠️", label:"走神提醒", type:"warning" },
        { emoji:"🏆", label:"表现优秀", type:"positive" },
        { emoji:"💬", label:"小声说话", type:"warning" },
        { emoji:"🐟", label:"上课摸鱼", type:"negative" },   // 已修改
        { emoji:"😴", label:"打瞌睡", type:"negative" },
        { emoji:"✏️", label:"作业认真", type:"positive" }
    ];
    
    function buildQuickActions() {
        const container = document.getElementById("quickActionsArea");
        container.innerHTML = "";
        QUICK_ACTIONS.forEach(act => {
            const btn = document.createElement("button");
            btn.className = `quick-btn ${act.type}`;
            btn.innerHTML = `${act.emoji} ${act.label}`;
            btn.addEventListener("click", () => {
                const studentsData = getCurrentData().students;
                if (studentsData.length === 0) { alert("请先添加学生"); return; }
                const studentNames = studentsData.map(s=>s.name).join(",");
                const student = prompt(`为哪个学生记录「${act.label}」？\n现有学生: ${studentNames}`);
                if (student && getCurrentData().students.find(s=>s.name === student)) {
                    addBehavior(student, act.label);
                } else if(student) alert(`学生“${student}”不存在，请先添加到点名器`);
            });
            container.appendChild(btn);
        });
    }
    
    // 页面加载及事件绑定
    function init() {
        loadAllData();
        currentEditDate = getTodayStr();
        buildQuickActions();
        renderAllByCurrentDate();
        renderCalendar();
        // 展示今日历史详情
        loadHistoryByDate(getTodayStr());
        
        document.getElementById("randomPickBtn").addEventListener("click", randomCall);
        document.getElementById("addStudentBtn").addEventListener("click", addNewStudent);
        document.getElementById("addCustomRecordBtn").addEventListener("click", () => {
            const studentSelect = document.getElementById("recordStudentSelect");
            const student = studentSelect.value;
            const customText = document.getElementById("recordCustomText").value.trim();
            if (!student || student === "请先添加学生") { alert("请先添加学生"); return; }
            if (!customText) { alert("请输入行为描述"); return; }
            addBehavior(student, customText);
            document.getElementById("recordCustomText").value = "";
        });
        document.getElementById("hornBtn").addEventListener("click", playLoudHorn);
        document.getElementById("prevMonthBtn").addEventListener("click", prevMonth);
        document.getElementById("nextMonthBtn").addEventListener("click", nextMonth);
        document.getElementById("gotoTodayBtn").addEventListener("click", gotoToday);
        
        document.body.addEventListener("click", enableAudioOnFirstClick, { once: true });
    }
    
    init();
</script>
</body>
</html>
